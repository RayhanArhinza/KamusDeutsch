<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Kamus DE–ID • Theme Switcher (Aurora / Neo-Brutalist)</title>
  <style>
    :root { color-scheme: light dark; }
    html,body{height:100%;margin:0}
    body{font-family: system-ui, -apple-system, Segoe UI, Roboto, Inter, sans-serif; background:#0b0b0b; color:#fff;}
    .bar{
      position: sticky; top:0; z-index:20;
      display:flex; align-items:center; gap:.5rem;
      padding:.75rem 1rem; background:#111; border-bottom:1px solid #2b2b2b;
    }
    .brand{font-weight:700; letter-spacing:.2px}
    .spacer{flex:1}
    .btn, select{
      appearance:none; background:#1a1a1a; color:#fff; border:1px solid #2b2b2b;
      padding:.5rem .75rem; border-radius:.6rem; font-weight:600; cursor:pointer;
    }
    .btn:hover{background:#212121}
    .frame-wrap{position:relative; height: calc(100vh - 56px);}
    iframe{
      position:absolute; inset:0; width:100%; height:100%; border:0; opacity:0; transform:scale(0.998);
      transition: opacity .25s ease, transform .25s ease;
      background:#fff; /* mencegah “flash” transparan saat loading */
    }
    iframe.ready{opacity:1; transform:scale(1)}
    .hint{font-size:.8rem; opacity:.7}
  </style>
</head>
<body>
  <header class="bar">
    <div class="brand">Kamus DE–ID • Theme Switcher</div>
    <div class="spacer"></div>

    <label class="hint" for="theme">Tema:</label>
    <select id="theme" aria-label="Pilih tema">
      <option value="aurora">Aurora Futuristik Klasik</option>
      <option value="neobrutal">Neo-Brutalist Editorial</option>
    </select>

    <button id="openStandalone" class="btn" title="Buka tema ini di tab baru">Buka Tab</button>
  </header>

  <main class="frame-wrap">
    <!-- Satu iframe; src diganti dinamis -->
    <iframe id="view" src="about:blank" referrerpolicy="no-referrer"></iframe>
  </main>

  <script>
    // Konfigurasi mapping tema → file. JANGAN ubah file tema agar desain tetap 100% sama.
    const THEMES = {
      aurora: 'tema-aurora.html',      // tempel kode #1 ke file ini
      neobrutal: 'tema-neobrutal.html' // tempel kode #2 ke file ini
    };

    const $sel = document.getElementById('theme');
    const $frame = document.getElementById('view');
    const $btnOpen = document.getElementById('openStandalone');

    // Baca preferensi dari query (?theme=aurora|neobrutal) lalu fallback ke localStorage
    const url = new URL(location.href);
    const qTheme = url.searchParams.get('theme');
    const stored = localStorage.getItem('kamus_theme');
    const initial = (qTheme && THEMES[qTheme]) ? qTheme : (stored && THEMES[stored]) ? stored : 'aurora';

    function setTheme(key, pushState = true){
      if(!THEMES[key]) return;
      $sel.value = key;
      localStorage.setItem('kamus_theme', key);

      // Update URL agar bisa dibookmark / dibagikan
      if (pushState) {
        const u = new URL(location.href);
        u.searchParams.set('theme', key);
        history.replaceState(null, '', u);
      }

      // Ganti src iframe
      $frame.classList.remove('ready');
      $frame.src = THEMES[key];
    }

    // Ketika iframe selesai load, tampilkan dengan animasi halus
    $frame.addEventListener('load', () => {
      requestAnimationFrame(() => $frame.classList.add('ready'));
    });

    $sel.addEventListener('change', () => setTheme($sel.value));
    $btnOpen.addEventListener('click', () => {
      const key = $sel.value;
      const href = THEMES[key];
      window.open(href, '_blank', 'noopener,noreferrer');
    });

    // Shortcut keyboard: 1 = aurora, 2 = neo
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName.match(/INPUT|TEXTAREA|SELECT/)) return;
      if (e.key === '1') setTheme('aurora');
      if (e.key === '2') setTheme('neobrutal');
    });

    // Inisialisasi
    setTheme(initial, false);
  </script>
</body>
</html>
