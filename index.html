<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kamus Jerman - Indonesia</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Poppins', 'sans-serif'],
          },
          colors: {
            accent: {
              50: '#fefce8',
              100: '#fef9c3',
              500: '#eab308',
              600: '#ca8a04',
            },
            neutral: {
              50: '#f8fafc',
              800: '#1e293b',
            },
          },
          animation: {
            'slide-in': 'slideIn 0.4s ease-out',
            'pop-in': 'popIn 0.3s ease-out',
            'pulse-glow': 'pulseGlow 1.5s ease-in-out infinite',
          },
          keyframes: {
            slideIn: {
              '0%': { opacity: '0', transform: 'translateX(-20px)' },
              '100%': { opacity: '1', transform: 'translateX(0)' }
            },
            popIn: {
              '0%': { opacity: '0', transform: 'scale(0.9)' },
              '100%': { opacity: '1', transform: 'scale(1)' }
            },
            pulseGlow: {
              '0%, 100%': { boxShadow: '0 0 0 0 rgba(234, 179, 8, 0.3)' },
              '50%': { boxShadow: '0 0 0 8px rgba(234, 179, 8, 0)' }
            }
          }
        }
      }
    }
  </script>
</head>
<body class="min-h-screen bg-neutral-50 font-sans">
  <!-- Header -->
  <header class="bg-neutral-800 text-white py-6 sm:py-8">
    <div class="container mx-auto px-4 sm:px-6">
      <div class="flex flex-col items-center text-center animate-slide-in">
        <div class="w-12 h-12 sm:w-14 sm:h-14 bg-accent-500 rounded-lg flex items-center justify-center mb-4">
          <span class="text-2xl sm:text-3xl">📖</span>
        </div>
        <h1 class="text-2xl sm:text-3xl md:text-4xl font-bold">Kamus Jerman - Indonesia</h1>
        <p class="text-sm sm:text-base mt-2 opacity-80 max-w-lg">Kembangkan kosakata Anda dengan alat pembelajaran yang interaktif dan modern</p>
      </div>
    </div>
  </header>

  <main class="container mx-auto px-4 sm:px-6 py-6 sm:py-8">
    <div class="flex flex-col lg:flex-row gap-6 sm:gap-8">
      <!-- Form Section -->
      <aside class="lg:w-1/3">
        <div class="bg-white p-6 sm:p-8 rounded-xl shadow-md animate-pop-in sticky top-4">
          <h2 class="text-lg sm:text-xl font-semibold text-neutral-800 mb-6">Tambah Kosakata Baru</h2>
          <form id="form" class="space-y-4">
            <div>
              <label class="block text-sm font-medium text-neutral-700 mb-1">🇩🇪 Bahasa Jerman</label>
              <input 
                type="text" 
                id="german" 
                class="w-full px-4 py-2.5 border border-neutral-200 rounded-lg focus:border-accent-500 focus:ring-1 focus:ring-accent-500 transition-all duration-300 bg-white" 
                placeholder="Kata dalam bahasa Jerman"
                required
              >
            </div>
            <div>
              <label class="block text-sm font-medium text-neutral-700 mb-1">🇮🇩 Bahasa Indonesia</label>
              <input 
                type="text" 
                id="indonesian" 
                class="w-full px-4 py-2.5 border border-neutral-200 rounded-lg focus:border-accent-500 focus:ring-1 focus:ring-accent-500 transition-all duration-300 bg-white" 
                placeholder="Terjemahan dalam bahasa Indonesia"
                required
              >
            </div>
            <div>
              <label class="block text-sm font-medium text-neutral-700 mb-1">📋 Kategori</label>
              <input 
                type="text" 
                id="category" 
                class="w-full px-4 py-2.5 border border-neutral-200 rounded-lg focus:border-accent-500 focus:ring-1 focus:ring-accent-500 transition-all duration-300 bg-white" 
                placeholder="Kategori (opsional)"
              >
            </div>
            <div>
              <label class="block text-sm font-medium text-neutral-700 mb-1">💬 Contoh Kalimat</label>
              <textarea 
                id="example" 
                class="w-full px-4 py-2.5 border border-neutral-200 rounded-lg focus:border-accent-500 focus:ring-1 focus:ring-accent-500 transition-all duration-300 bg-white" 
                placeholder="Contoh kalimat (opsional)"
                rows="3"
              ></textarea>
            </div>
            <button 
              type="submit" 
              class="w-full bg-accent-500 text-white py-2.5 px-6 rounded-lg font-medium hover:bg-accent-600 transition-all duration-300 animate-pulse-glow"
            >
              Tambah
            </button>
          </form>
        </div>
      </aside>

      <!-- Content Section -->
      <section class="lg:w-2/3">
        <!-- Search Bar -->
        <div class="mb-6">
          <div class="relative">
            <svg class="w-5 h-5 text-neutral-400 absolute left-3 top-1/2 transform -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
            <input 
              type="text" 
              id="search" 
              placeholder="Cari kosakata, kategori, atau contoh..." 
              class="w-full pl-10 pr-4 py-2.5 border border-neutral-200 rounded-lg focus:border-accent-500 focus:ring-1 focus:ring-accent-500 transition-all duration-300 bg-white"
            >
          </div>
        </div>

        <!-- Vocabulary Cards -->
        <div id="data-container" class="space-y-4 animate-slide-in">
          <!-- Cards will be inserted here -->
        </div>

        <!-- Pagination -->
        <div class="mt-6 flex flex-col sm:flex-row items-center justify-between gap-4">
          <div class="text-sm text-neutral-600">
            Menampilkan <span id="page-info">1-5</span> dari <span id="total-items">0</span> entri
          </div>
          <div class="flex space-x-2">
            <button id="prev-page" 
              class="px-4 py-2 bg-neutral-100 text-neutral-600 rounded-lg hover:bg-neutral-200 transition-all duration-300 disabled:opacity-50 disabled:cursor-not-allowed"
              disabled>
               Previous
            </button>
            <div id="page-numbers" class="flex space-x-1 items-center"></div>
            <button id="next-page" 
              class="px-4 py-2 bg-neutral-100 text-neutral-600 rounded-lg hover:bg-neutral-200 transition-all duration-300 disabled:opacity-50 disabled:cursor-not-allowed"
              disabled>
              Next
            </button>
          </div>
        </div>
      </section>
    </div>
  </main>

  <!-- Modal Edit -->
  <div id="editModal" class="fixed inset-0 flex items-center justify-center bg-black/70 hidden z-50">
    <div class="bg-white p-6 sm:p-8 rounded-xl w-full max-w-md mx-4 animate-pop-in">
      <h2 class="text-lg sm:text-xl font-semibold text-neutral-800 mb-6">Edit Kosakata</h2>
      <form id="editForm" class="space-y-4">
        <input type="hidden" id="edit-id">
        <div>
          <label class="block text-sm font-medium text-neutral-700 mb-1">🇩🇪 Bahasa Jerman</label>
          <input 
            type="text" 
            id="edit-german" 
            class="w-full px-4 py-2.5 border border-neutral-200 rounded-lg focus:border-accent-500 focus:ring-1 focus:ring-accent-500 transition-all duration-300 bg-white" 
            required
          >
        </div>
        <div>
          <label class="block text-sm font-medium text-neutral-700 mb-1">🇮🇩 Bahasa Indonesia</label>
          <input 
            type="text" 
            id="edit-indonesian" 
            class="w-full px-4 py-2.5 border border-neutral-200 rounded-lg focus:border-accent-500 focus:ring-1 focus:ring-accent-500 transition-all duration-300 bg-white" 
            required
          >
        </div>
        <div>
          <label class="block text-sm font-medium text-neutral-700 mb-1">📋 Kategori</label>
          <input 
            type="text" 
            id="edit-category" 
            class="w-full px-4 py-2.5 border border-neutral-200 rounded-lg focus:border-accent-500 focus:ring-1 focus:ring-accent-500 transition-all duration-300 bg-white" 
            placeholder="Kategori (opsional)"
          >
        </div>
        <div>
          <label class="block text-sm font-medium text-neutral-700 mb-1">💬 Contoh Kalimat</label>
          <textarea 
            id="edit-example" 
            class="w-full px-4 py-2.5 border border-neutral-200 rounded-lg focus:border-accent-500 focus:ring-1 focus:ring-accent-500 transition-all duration-300 bg-white" 
            placeholder="Contoh kalimat (opsional)"
            rows="3"
          ></textarea>
        </div>
        <div class="flex justify-end space-x-3 pt-2">
          <button 
            type="button" 
            onclick="closeModal()" 
            class="px-4 py-2 text-neutral-600 hover:text-neutral-800 rounded-lg hover:bg-neutral-100 transition-all duration-300"
          >
            Batal
          </button>
          <button 
            type="submit" 
            class="px-4 py-2 bg-accent-500 text-white rounded-lg hover:bg-accent-600 transition-all duration-300"
          >
            Simpan
          </button>
        </div>
      </form>
    </div>
  </div>

<div id="loadingOverlay" class="fixed inset-0 bg-neutral-50/90 flex items-center justify-center z-50 hidden">
  <div class="text-center">
    <div class="w-10 h-10 border-4 border-accent-500/30 border-t-accent-500 rounded-full animate-spin mb-3 mx-auto"></div>
    <p class="text-neutral-600 text-sm font-medium">Memuat...</p>
  </div>
</div>

  <script>
    const URL = "https://script.google.com/macros/s/AKfycbxhkEhfVgdn2B2cWyXCg6YP2y6-7-2jPc06PXD2BJqfnThdvguoI9rNOrRS9EQs_IJA/exec";

    const form = document.getElementById('form');
    const dataContainer = document.getElementById('data-container');
    const searchInput = document.getElementById('search');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const prevPageBtn = document.getElementById('prev-page');
    const nextPageBtn = document.getElementById('next-page');
    const pageNumbers = document.getElementById('page-numbers');
    const pageInfo = document.getElementById('page-info');
    const totalItems = document.getElementById('total-items');

    const editModal = document.getElementById('editModal');
    const editForm = document.getElementById('editForm');
    const editId = document.getElementById('edit-id');
    const editGerman = document.getElementById('edit-german');
    const editIndo = document.getElementById('edit-indonesian');
    const editCategory = document.getElementById('edit-category');
    const editExample = document.getElementById('edit-example');

    let dataList = [];
    let currentPage = 1;
    const itemsPerPage = 5;
    const maxPageButtons = 3;

    const showLoading = () => loadingOverlay.classList.remove('hidden');
    const hideLoading = () => loadingOverlay.classList.add('hidden');

    const showNotification = (message, type = 'success') => {
      const notification = document.createElement('div');
      notification.className = `fixed bottom-4 right-4 px-4 py-2 rounded-lg text-white text-sm font-medium shadow-lg z-50 animate-pop-in ${
        type === 'success' ? 'bg-accent-500' : 'bg-red-500'
      }`;
      notification.textContent = message;
      document.body.appendChild(notification);
      
      setTimeout(() => {
        notification.classList.add('opacity-0');
        setTimeout(() => notification.remove(), 300);
      }, 3000);
    };

    const speakText = (text) => {
      if (!text) return;
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'de-DE';
      utterance.rate = 1.0;
      utterance.pitch = 1.0;
      window.speechSynthesis.speak(utterance);
    };

    const fetchData = async () => {
      try {
        showLoading();
        const res = await fetch(URL);
        dataList = await res.json();
        currentPage = 1;
        renderData();
        updatePagination();
        hideLoading();
      } catch (error) {
        console.error('Error fetching data:', error);
        hideLoading();
        showNotification('Gagal memuat data. Silakan coba lagi.', 'error');
      }
    };

    const renderData = (filter = '') => {
      dataContainer.innerHTML = '';
      const filtered = dataList.filter(item =>
        item.german.toLowerCase().includes(filter.toLowerCase()) ||
        item.indonesian.toLowerCase().includes(filter.toLowerCase()) ||
        item.category.toLowerCase().includes(filter.toLowerCase()) ||
        item.example.toLowerCase().includes(filter.toLowerCase())
      );

      if (filtered.length === 0) {
        dataContainer.innerHTML = `
          <div class="bg-white p-6 rounded-xl shadow-md text-center text-neutral-500">
            <div class="text-3xl mb-2">📝</div>
            <p class="font-medium">Tidak ada data ditemukan</p>
            <p class="text-sm">Coba kata kunci lain atau tambah kosakata baru</p>
          </div>
        `;
        totalItems.textContent = '0';
        pageInfo.textContent = '0-0';
        pageNumbers.innerHTML = '';
        prevPageBtn.disabled = true;
        nextPageBtn.disabled = true;
        return;
      }

      const startIndex = (currentPage - 1) * itemsPerPage;
      const endIndex = startIndex + itemsPerPage;
      const paginatedItems = filtered.slice(startIndex, endIndex);

      totalItems.textContent = filtered.length;
      pageInfo.textContent = `${startIndex + 1}-${Math.min(endIndex, filtered.length)}`;

      paginatedItems.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'bg-white p-6 rounded-xl shadow-md hover:shadow-lg transition-all duration-300';
        card.innerHTML = `
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div class="flex-1">
              <div class="flex items-center space-x-3 mb-2">
                <button 
                  onclick="speakText('${item.german.replace(/'/g, "\\'")}')" 
                  class="text-neutral-500 hover:text-accent-600 transition-colors duration-300"
                  title="Dengar pengucapan"
                >
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707a1 1 0 011.414 0l2.121 2.121a1 1 0 010 1.414L9.414 12l4.414 4.414a1 1 0 010 1.414l-2.121 2.121a1 1 0 01-1.414 0L5.586 15z" />
                  </svg>
                </button>
                <h3 class="font-semibold text-neutral-800">${item.german}</h3>
              </div>
              <p class="text-neutral-600"><span class="font-medium">Terjemahan:</span> ${item.indonesian}</p>
              <p class="text-neutral-600"><span class="font-medium">Kategori:</span> ${item.category || '-'}</p>
              ${item.example ? `
                <div class="flex items-center space-x-3 mt-2">
                  <button 
                    onclick="speakText('${item.example.replace(/'/g, "\\'")}')" 
                    class="text-neutral-500 hover:text-accent-600 transition-colors duration-300"
                    title="Dengar contoh kalimat"
                  >
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707a1 1 0 011.414 0l2.121 2.121a1 1 0 010 1.414L9.414 12l4.414 4.414a1 1 0 010 1.414l-2.121 2.121a1 1 0 01-1.414 0L5.586 15z" />
                    </svg>
                  </button>
                  <p class="text-neutral-600"><span class="font-medium">Contoh:</span> ${item.example}</p>
                </div>
              ` : '<p class="text-neutral-600"><span class="font-medium">Contoh:</span> -</p>'}
            </div>
            <div class="flex space-x-2 mt-4 sm:mt-0">
              <button 
                onclick="openEditModal('${item.id}', '${item.german.replace(/'/g, "\\'")}', '${item.indonesian.replace(/'/g, "\\'")}', '${item.category.replace(/'/g, "\\'")}', '${item.example.replace(/'/g, "\\'")}')" 
                class="px-3 py-1.5 text-sm bg-accent-100 text-accent-700 rounded-lg hover:bg-accent-200 transition-all duration-300"
              >
                Edit
              </button>
              <button 
                onclick="deleteEntry('${item.id}')" 
                class="px-3 py-1.5 text-sm bg-red-100 text-red-700 rounded-lg hover:bg-red-200 transition-all duration-300"
              >
                Hapus
              </button>
            </div>
          </div>
        `;
        dataContainer.appendChild(card);
      });

      updatePagination(filtered.length);
    };

    const updatePagination = (totalItemsCount = dataList.length) => {
      const totalPages = Math.ceil(totalItemsCount / itemsPerPage);
      pageNumbers.innerHTML = '';

      let startPage = Math.max(1, currentPage - Math.floor(maxPageButtons / 2));
      let endPage = Math.min(totalPages, startPage + maxPageButtons - 1);

      if (endPage === totalPages) {
        startPage = Math.max(1, endPage - maxPageButtons + 1);
      }

      if (startPage > 1) {
        const firstButton = document.createElement('button');
        firstButton.className = 'px-3 py-1.5 rounded-lg bg-neutral-100 text-neutral-600 hover:bg-neutral-200 transition-all duration-300';
        firstButton.textContent = '1';
        firstButton.onclick = () => {
          currentPage = 1;
          renderData(searchInput.value);
        };
        pageNumbers.appendChild(firstButton);

        if (startPage > 2) {
          const ellipsis = document.createElement('span');
          ellipsis.className = 'px-3 py-1.5 text-neutral-600';
          ellipsis.textContent = '...';
          pageNumbers.appendChild(ellipsis);
        }
      }

      for (let i = startPage; i <= endPage; i++) {
        const button = document.createElement('button');
        button.className = `px-3 py-1.5 rounded-lg transition-all duration-300 ${
          i === currentPage
            ? 'bg-accent-500 text-white'
            : 'bg-neutral-100 text-neutral-600 hover:bg-neutral-200'
        }`;
        button.textContent = i;
        button.onclick = () => {
          currentPage = i;
          renderData(searchInput.value);
        };
        pageNumbers.appendChild(button);
      }

      if (endPage < totalPages) {
        if (endPage < totalPages - 1) {
          const ellipsis = document.createElement('span');
          ellipsis.className = 'px-3 py-1.5 text-neutral-600';
          ellipsis.textContent = '...';
          pageNumbers.appendChild(ellipsis);
        }

        const lastButton = document.createElement('button');
        lastButton.className = 'px-3 py-1.5 rounded-lg bg-neutral-100 text-neutral-600 hover:bg-neutral-200 transition-all duration-300';
        lastButton.textContent = totalPages;
        lastButton.onclick = () => {
          currentPage = totalPages;
          renderData(searchInput.value);
        };
        pageNumbers.appendChild(lastButton);
      }

      prevPageBtn.disabled = currentPage === 1;
      nextPageBtn.disabled = currentPage === totalPages;
    };

    prevPageBtn.addEventListener('click', () => {
      if (currentPage > 1) {
        currentPage--;
        renderData(searchInput.value);
      }
    });

    nextPageBtn.addEventListener('click', () => {
      if (currentPage < Math.ceil(dataList.length / itemsPerPage)) {
        currentPage++;
        renderData(searchInput.value);
      }
    });

    form.onsubmit = async (e) => {
      e.preventDefault();
      const payload = {
        action: 'create',
        german: document.getElementById('german').value,
        indonesian: document.getElementById('indonesian').value,
        category: document.getElementById('category').value,
        example: document.getElementById('example').value
      };
      
      try {
        showLoading();
        const response = await fetch(URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });
        const result = await response.text();
        hideLoading();
        
        if (response.ok && result === "Success") {
          form.reset();
          fetchData();
          showNotification('Kosakata berhasil ditambahkan!');
        } else {
          throw new Error('Failed to add entry: ' + result);
        }
      } catch (error) {
        console.error('Error adding entry:', error);
        hideLoading();
        showNotification('Gagal menambahkan kosakata. Silakan coba lagi.', 'error');
      }
    };

    let searchTimeout;
    searchInput.addEventListener("input", e => {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        currentPage = 1;
        renderData(e.target.value);
      }, 300);
    });

    function openEditModal(id, german, indonesian, category, example) {
      editId.value = id;
      editGerman.value = german;
      editIndo.value = indonesian;
      editCategory.value = category;
      editExample.value = example;
      editModal.classList.remove("hidden");
    }

    function closeModal() {
      editModal.classList.add("hidden");
    }

    editModal.addEventListener('click', (e) => {
      if (e.target === editModal) {
        closeModal();
      }
    });

    editForm.onsubmit = async (e) => {
      e.preventDefault();
      const payload = {
        action: 'update',
        id: editId.value,
        german: editGerman.value,
        indonesian: editIndo.value,
        category: editCategory.value,
        example: editExample.value
      };
      
      try {
        showLoading();
        const response = await fetch(URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });
        const result = await response.text();
        hideLoading();
        
        if (response.ok && result === "Updated") {
          closeModal();
          fetchData();
          showNotification('Kosakata berhasil diperbarui!');
        } else {
          throw new Error('Failed to update entry: ' + result);
        }
      } catch (error) {
        console.error('Error updating entry:', error);
        hideLoading();
        showNotification('Gagal memperbarui kosakata. Silakan coba lagi.', 'error');
      }
    };

    async function deleteEntry(id) {
      if (!confirm("Yakin ingin menghapus kosakata ini?")) return;
      
      const payload = {
        action: 'delete',
        id: id
      };
      
      try {
        showLoading();
        const response = await fetch(URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });
        const result = await response.text();
        hideLoading();
        
        if (response.ok && result === "Deleted") {
          fetchData();
          showNotification('Kosakata berhasil dihapus!');
        } else {
          throw new Error('Failed to delete entry: ' + result);
        }
      } catch (error) {
        console.error('Error deleting entry:', error);
        hideLoading();
        showNotification('Gagal menghapus kosakata. Silakan coba lagi.', 'error');
      }
    }

    fetchData();

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !editModal.classList.contains('hidden')) {
        closeModal();
      }
    });
  </script>
</body>
</html>
